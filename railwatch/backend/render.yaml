databases:
  - name: naha-railwatch-db
    plan: 0.5c-1g
    region: frankfurt
    databaseName: naha_railwatch_db
    user: naha_railwatch_db_user

services:
  - type: keyvalue
    name: naha-railwatch-events
    plan: 1g
    region: frankfurt
    maxmemoryPolicy: allkeys_lru

  - type: web
    name: naha-railwatch-api
    plan: 1c-2g
    runtime: python
    rootDir: railwatch/backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: RAILWATCH_INGEST_KEY
        sync: false
      - key: RAILWATCH_WS_KEY
        sync: false
      - key: RAILWATCH_ALLOWED_ORIGINS
        value: https://naha-railwatch.onrender.com
      - key: RAILWATCH_OPERATOR_ACCESS_CODE
        sync: false
      - key: RAILWATCH_SIGNING_SECRET
        generateValue: true
      - key: RAILWATCH_OPERATOR_SECRET
        generateValue: true
      - key: RAILWATCH_DEMO_MODE
        value: "false"
      - key: RAILWATCH_ALLOW_DEMO_ON_MAIN
        value: "false"
        # Enable only on a controlled sales/demo environment. Production must remain false.
      - key: RAILWATCH_DEFAULT_TENANT
        value: NahaLabs-RailWatch
      - key: RAILWATCH_REQUIRE_PERSISTENCE
        value: "true"
      - key: RAILWATCH_REQUIRE_AUDIT
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: naha-railwatch-db
          property: connectionString
      - key: RAILWATCH_REDIS_URL
        fromService:
          name: naha-railwatch-events
          type: keyvalue
          property: connectionString
      - key: RAILWATCH_APP_URL
        value: https://naha-railwatch.onrender.com
      - key: WHATSAPP_OPERATOR_URL
        value: https://my-own-whatsapp-2z5h.onrender.com
      - key: WHATSAPP_OPERATOR_API_KEY
        sync: false
      - key: WHATSAPP_WEBHOOK_SECRET
        sync: false
      - key: WHATSAPP_APP_ID
        value: railwatch
      - key: RAILWATCH_WHATSAPP_ENABLED
        value: "true"
      - key: RAILWATCH_WHATSAPP_AUTO_ALERTS
        value: "false"
      - key: RAILWATCH_WHATSAPP_ALERT_RECIPIENTS
        sync: false
      - key: RAILWATCH_WHATSAPP_OPERATORS
        sync: false
      - key: NAHALLM_URL
        sync: false
      - key: NAHALLM_API_KEY
        sync: false
      - key: NAHALLM_MODEL
        value: balanced
      - key: NAHALLM_TIMEOUT_SECONDS
        value: "20"
      - key: RAILWATCH_AI_RATE_LIMIT_PER_MIN
        value: "10"
      - key: RAILWATCH_AUTH_RATE_LIMIT_PER_MIN
        value: "10"
