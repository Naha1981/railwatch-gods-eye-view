name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [24.14.0, 26.x]
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: ${{ matrix.node == '24.14.0' && '1' || '0' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate NahaLabs control-loop contract
        run: npm run nahalabs:control-loop:validate

      - name: Run setup policy checks
        run: npm run doctor -- --json

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

  railwatch-backend:
    name: RailWatch backend contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: railwatch/backend/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install -r railwatch/backend/requirements.txt

      - name: Run backend contract tests
        working-directory: railwatch/backend
        run: python -m unittest discover -s . -p 'test_*.py' -v

  railwatch-smoke:
    name: RailWatch operator smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PUPPETEER_SKIP_DOWNLOAD: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for headless operator test
        run: npx puppeteer browsers install chrome

      - name: Run RailWatch end-to-end smoke
        run: node scripts/railwatch-public-demo-regression.mjs && npm run railwatch:smoke

      - name: Upload RailWatch smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: railwatch-smoke-evidence
          path: artifacts/railwatch-smoke-*.png
          if-no-files-found: ignore
          retention-days: 7

  railwatch-whatsapp-ux:
    name: RailWatch WhatsApp workspace UX
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PUPPETEER_SKIP_DOWNLOAD: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Install Chromium for WhatsApp workspace QA
        run: npx puppeteer browsers install chrome

      - name: Run WhatsApp workspace QA
        run: npm run railwatch:whatsapp-qa && node scripts/railwatch-workspace-qa.mjs

  windows-onboarding:
    name: Windows onboarding
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PUPPETEER_SKIP_DOWNLOAD: '1'
      GEV_REQUIRE_ALLOCATION_GATE: '0'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: npm

      - name: Run the Pinokio install path
        run: node scripts/pinokio-install.mjs

      - name: Run focused onboarding tests
        run: node --test src/setupDoctor.test.mjs src/pinokioEnvironment.test.mjs src/pinokioPreflight.test.mjs src/pinokioLauncherContract.test.mjs src/mapStartup.test.mjs src/hudSummaryResponse.test.mjs

      - name: Build production bundle
        run: npm run build
